apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
      - name: frontend
        image: 897258608762.dkr.ecr.ap-south-1.amazonaws.com/graphic-frontend:v3
        imagePullPolicy: Always

        ports:
        - containerPort: 80
