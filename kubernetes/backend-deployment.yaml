apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend
        image: 897258608762.dkr.ecr.ap-south-1.amazonaws.com/graphic-backend:v2

        imagePullPolicy: Always

        ports:
        - containerPort: 5050

        env:
        - name: PORT
          value: "5050"

        - name: DB_HOST
          value: "mysql-service"

        - name: DB_USER
          value: "root"

        - name: DB_PASSWORD
          value: "stackly123"

        - name: DB_NAME
          value: "stackly_db"

        - name: JWT_SECRET
          value: "stackly_secret_key"

        - name: CLOUD_NAME
          value: "dhwcekj4o"

        - name: API_KEY
          value: "376693445739729"

        - name: API_SECRET
          value: "Ko1fttSN4pGCA2iJ_9omQ5Zgj9U"

        - name: PEXELS_API_KEY
          value: "Yky2JTJn1dUfIPqm9OxA8xRGkDx9x9IBDmKQrA4vjtCrwZb9RJpnVgF5"
